name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"

permissions:
  contents: write  # required for svenstaro/upload-release-action to create
                   # the release and attach assets when a tag is pushed.

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    strategy:
      matrix:
        # Default amd64+386 across all OSes
        goos: [linux, darwin, windows, freebsd]
        goarch: [amd64, 386]
        exclude:
          - goarch: 386
            goos: darwin
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          - goos: windows
            goarch: arm64
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5

      - name: Resolve asset name
        id: get_filename
        run: |
          # friendly-filenames.json maps GOOS-GOARCH(+ARM) to the suffix that
          # install.sh expects (e.g. linux-amd64 → linux-64, linux-arm64 →
          # linux-arm64-v8a). The final asset name is `sukad-<suffix>.zip`.
          KEY="${GOOS}-${GOARCH}${GOARM}"
          NAME=$(jq -r --arg k "$KEY" '.[$k].friendlyName // empty' < .github/build/friendly-filenames.json)
          if [ -z "$NAME" ]; then
            NAME="${GOOS}-${GOARCH}${GOARM}"
            echo "::warning::No friendly name for $KEY, falling back to $NAME"
          fi
          echo "ASSET_NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Resolved $KEY → $NAME"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Build sukad
        run: |
          mkdir -p build_assets
          go build -v -trimpath \
            -ldflags "-X 'github.com/owo-space/sukad/cmd.version=$VERSION' -s -w -buildid=" \
            -o build_assets/sukad .

      - name: Also build mips softfloat
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        env:
          GOMIPS: softfloat
        run: |
          go build -v -trimpath \
            -ldflags "-X 'github.com/owo-space/sukad/cmd.version=$VERSION' -s -w -buildid=" \
            -o build_assets/sukad_softfloat .

      - name: Rename Windows binary
        if: matrix.goos == 'windows'
        run: |
          mv build_assets/sukad build_assets/sukad.exe
          if [ -f build_assets/sukad_softfloat ]; then
            mv build_assets/sukad_softfloat build_assets/sukad_softfloat.exe
          fi

      - name: Stage release files
        run: |
          cp README.md LICENSE build_assets/

      - name: Pack ZIP + checksums
        shell: bash
        run: |
          pushd build_assets
          # Stable timestamps so the zip checksum is reproducible per content.
          touch -mt $(date +%Y01010000) ./*
          zip -9vr "../sukad-${ASSET_NAME}.zip" .
          popd
          FILE="./sukad-${ASSET_NAME}.zip"
          DGST="$FILE.dgst"
          for METHOD in md5 sha1 sha256 sha512; do
            openssl dgst -"$METHOD" "$FILE" | sed 's/([^)]*)//g' >> "$DGST"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: sukad-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./sukad-${{ steps.get_filename.outputs.ASSET_NAME }}.zip
            ./sukad-${{ steps.get_filename.outputs.ASSET_NAME }}.zip.dgst

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./sukad-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true
